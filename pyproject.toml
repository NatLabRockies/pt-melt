[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptmelt"
version = "0.1.4"
description = "PyTorch Machine Learning Toolbox (PT-MELT)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Nicholas T. Wimer", email = "nwimer@nlr.gov" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "matplotlib",
    "numpy",
    "scikit-learn",
    "scipy",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
hpo = [
    "optuna",
    "ray[tune]",
]
dev = [
    "build",
    "ipython",
    "ruff",
]
test = [
    "pytest",
    "pytest-cov",
]
doc = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Repository = "https://github.com/NatLabRockies/pt-melt"

[tool.setuptools.packages.find]
include = ["ptmelt*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.pypi-dependencies]
ptmelt = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
hpo = { features = ["hpo"], solve-group = "default" }
test = { features = ["test", "hpo"], solve-group = "default" }
doc = { features = ["doc"], solve-group = "default" }
dev = { features = ["dev", "test", "hpo", "doc"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
lint = "ruff check ptmelt tests"
format = "ruff format ptmelt tests"
format-check = "ruff format --check ptmelt tests"

[tool.pixi.feature.test.tasks]
tests = "pytest -q tests"

[tool.pixi.feature.doc.tasks]
docs = { cmd = "make html", cwd = "Docs" }
